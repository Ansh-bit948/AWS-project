AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: IEAI-ALP cost-conscious event-driven access intelligence research stack
Parameters:
  AllowedOrigins:
    Type: String
    Default: 'http://127.0.0.1:8000'
    Description: Primary local demo origin allowed to call the API and upload to S3.
  AppName:
    Type: String
    Default: ieai-alp
  BudgetEmail:
    Type: String
    Description: Replace with a monitored email; budget alerts are notifications, not a spending cap.
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        RESULTS_TABLE: !Ref ResultsTable
        RAW_BUCKET: !Sub '${AppName}-raw-${AWS::AccountId}-${AWS::Region}'
Resources:
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-results'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expires_at
        Enabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
  RawDataBucket:
    Type: AWS::S3::Bucket
    DependsOn: ProcessDatasetPermission
    Properties:
      BucketName: !Sub '${AppName}-raw-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigins, 'http://localhost:8000']
            AllowedMethods: [PUT]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireResearchUploads
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30
          - Id: ExpireResearchResults
            Status: Enabled
            Prefix: results/
            ExpirationInDays: 30
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessDatasetFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
  ProcessDatasetPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessDatasetFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}'
  ProcessDatasetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../app/
      Handler: cloud_handler.process_s3
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}/raw/*'
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}/results/*'
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem, dynamodb:GetItem]
              Resource: !GetAtt ResultsTable.Arn
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../app/
      Handler: cloud_handler.api_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}/raw/*'
            - Effect: Allow
              Action: [s3:GetObject, s3:PutObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}/results/*'
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan, dynamodb:Query, dynamodb:PutItem, dynamodb:UpdateItem]
              Resource: !GetAtt ResultsTable.Arn
        - Statement:
            - Effect: Allow
              Action: [access-analyzer:ValidatePolicy]
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResearchApi
            Path: /{proxy+}
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResearchApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
  CognitoPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AppName}-admins'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
  CognitoClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AppName}-web'
      UserPoolId: !Ref CognitoPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
  ResearchApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigins, 'http://localhost:8000']
        AllowHeaders: [authorization,content-type]
        AllowMethods: [GET,POST,OPTIONS]
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoPool}'
              audience: [!Ref CognitoClient]
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AppName}-monthly-watch'
        BudgetLimit:
          Amount: 1
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 0.1
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
Outputs:
  ApiUrl:
    Value: !Sub 'https://${ResearchApi}.execute-api.${AWS::Region}.amazonaws.com'
  Region:
    Value: !Ref AWS::Region
  RawBucket:
    Value: !Ref RawDataBucket
  UserPoolId:
    Value: !Ref CognitoPool
  UserPoolClientId:
    Value: !Ref CognitoClient
