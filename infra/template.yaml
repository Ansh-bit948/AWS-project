AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: IEAI-ALP cost-conscious event-driven access intelligence research stack
Parameters:
  AllowedOrigin:
    Type: String
    Default: '*'
    Description: Set to the exact CloudFront or S3 website origin before production use.
  AppName:
    Type: String
    Default: ieai-alp
  BudgetEmail:
    Type: String
    Description: Replace with a monitored email; budget alerts are notifications, not a spending cap.
Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 512
    Environment:
      Variables:
        RESULTS_TABLE: !Ref ResultsTable
        RAW_BUCKET: !Sub '${AppName}-raw-${AWS::AccountId}-${AWS::Region}'
Resources:
  ResultsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${AppName}-results'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true
  RawDataBucket:
    Type: AWS::S3::Bucket
    DependsOn: ProcessDatasetPermission
    Properties:
      BucketName: !Sub '${AppName}-raw-${AWS::AccountId}-${AWS::Region}'
      VersioningConfiguration:
        Status: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref AllowedOrigin]
            AllowedMethods: [PUT]
            AllowedHeaders: ['*']
            ExposedHeaders: [ETag]
            MaxAge: 3000
      LifecycleConfiguration:
        Rules:
          - Id: ExpireResearchUploads
            Status: Enabled
            Prefix: raw/
            ExpirationInDays: 30
      NotificationConfiguration:
        LambdaConfigurations:
          - Event: s3:ObjectCreated:*
            Function: !GetAtt ProcessDatasetFunction.Arn
            Filter:
              S3Key:
                Rules:
                  - Name: prefix
                    Value: raw/
  ProcessDatasetPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ProcessDatasetFunction
      Principal: s3.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}'
  ProcessDatasetFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: app.cloud_handler.process_s3
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}/raw/*'
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}/results/*'
        - Statement:
            - Effect: Allow
              Action: [dynamodb:PutItem]
              Resource: !GetAtt ResultsTable.Arn
  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: app.cloud_handler.api_handler
      Policies:
        - Statement:
            - Effect: Allow
              Action: [s3:PutObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}/raw/*'
            - Effect: Allow
              Action: [s3:GetObject]
              Resource: !Sub 'arn:${AWS::Partition}:s3:::${AppName}-raw-${AWS::AccountId}-${AWS::Region}/results/*'
        - Statement:
            - Effect: Allow
              Action: [dynamodb:GetItem, dynamodb:Scan]
              Resource: !GetAtt ResultsTable.Arn
        - Statement:
            - Effect: Allow
              Action: [access-analyzer:ValidatePolicy]
              Resource: '*'
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref ResearchApi
            Path: /{proxy+}
            Method: ANY
            Auth:
              Authorizer: CognitoAuthorizer
  CognitoPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${AppName}-admins'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      AutoVerifiedAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          RequireUppercase: true
  CognitoClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AppName}-web'
      UserPoolId: !Ref CognitoPool
      GenerateSecret: false
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
  ResearchApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowHeaders: [authorization,content-type]
        AllowMethods: [GET,POST,OPTIONS]
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoPool}'
              audience: [!Ref CognitoClient]
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${AppName}-web-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
  FrontendOriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AppName}-static-origin'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2and3
        Origins:
          - Id: private-s3-origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
            OriginAccessControlId: !Ref FrontendOriginAccess
        DefaultCacheBehavior:
          TargetOriginId: private-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
  FrontendReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontendBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}'
  Budget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AppName}-monthly-watch'
        BudgetLimit:
          Amount: 1
          Unit: USD
        TimeUnit: MONTHLY
        BudgetType: COST
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 0
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
Outputs:
  ApiUrl:
    Value: !Sub 'https://${ResearchApi}.execute-api.${AWS::Region}.amazonaws.com'
  Region:
    Value: !Ref AWS::Region
  RawBucket:
    Value: !Ref RawDataBucket
  FrontendBucket:
    Value: !Ref FrontendBucket
  FrontendWebsite:
    Value: !Sub 'https://${FrontendDistribution.DomainName}'
  UserPoolId:
    Value: !Ref CognitoPool
  UserPoolClientId:
    Value: !Ref CognitoClient
